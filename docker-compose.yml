name: multica

# The optional Fleet control plane is not part of this project: it lives in
# docker-compose.fleet.yml and runs under its own per-worktree Compose project
# (see scripts/fleet-env.sh). It joins multica_default, the network created here.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: multica
      POSTGRES_USER: ${POSTGRES_USER:-multica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multica}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
